<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS/JS Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Theme Switcher -->
        <div class="theme-switcher">
            <select id="themeSelector">
                <option value="light">Light Theme</option>
                <option value="dark">Dark Theme</option>
            </select>
        </div>

        <!-- Animated Element -->
        <div class="animated-box" id="targetElement"></div>

        <!-- Animation Trigger -->
        <button class="anim-button" id="animateBtn">Trigger Animation</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
